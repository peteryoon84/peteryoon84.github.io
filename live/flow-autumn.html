<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>플로우-가을 Flow-Autumn — 실시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 화면 전체가 물. 조절판은 오른쪽(휴대폰은 아래) 반투명 판 — 그림을 가리지 않게 접힌다 */
:root {
  --bg: #07090c;
  --panel: rgba(12, 15, 19, 0.86);
  --line: rgba(196, 210, 222, 0.14);
  --fg: #e4e9ee;
  --dim: #8d99a5;
  --accent: #ff5a4e;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#fallback { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.hud { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: baseline;
  font: 500 12px/1.4 var(--mono); color: var(--fg); text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }
.hud b { font: 600 13px/1.4 var(--sans); letter-spacing: .02em; }
.hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font: 400 13px/1.4 var(--sans); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
  pointer-events: none; transition: opacity .8s; white-space: nowrap; }
#toggle { position: fixed; right: 16px; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 3;
  font: 600 13px/1 var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  padding: 10px 14px; border-radius: 8px; cursor: pointer; }
#toggle:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#panel { position: fixed; right: 16px; top: calc(56px + env(safe-area-inset-top, 0px)); bottom: 16px; width: 300px; z-index: 2;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-y: auto; padding: 14px 16px 18px;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 16px; }
#panel h2 { font: 600 11px/1 var(--sans); letter-spacing: .12em; color: var(--dim); margin: 0 0 8px; }
.presets { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.presets button { font: 500 12px/1 var(--mono); padding: 9px 0; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.presets button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.pdesc { font: 400 12px/1.45 var(--sans); color: var(--dim); margin-top: 8px; min-height: 2.9em; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin-bottom: 8px; }
.row label { font: 400 13px/1.3 var(--sans); }
.row select { grid-column: 1 / -1; width: 100%; font: 400 13px/1.3 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; margin-top: 2px; }
.row select option { background: var(--bg); }
.row output { font: 400 12px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.colors label { display: flex; flex-direction: column; gap: 4px; font: 400 12px/1.2 var(--sans); color: var(--dim); }
.colors input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: transparent; padding: 0; }
.cways { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
.cways button { height: 28px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.seg button, .acts button, .file { font: 500 13px/1 var(--sans); padding: 10px 0; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-align: center; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.file { display: block; margin-top: 8px; }
.file input { display: none; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.steps { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto auto; gap: 4px; align-items: center; font: 400 12px/1.3 var(--sans); }
.steps .sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps label { display: flex; flex-direction: column; font-size: 10px; color: var(--dim); }
.steps input { width: 3.4em; font: 400 12px/1 var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 3px; }
.steps button { font: 12px/1 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; cursor: pointer; }
.transport { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.transport button { font: 600 13px/1 var(--sans); padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; }
.transport output { font: 400 12px/1 var(--mono); color: var(--dim); margin-left: auto; }
#seqPos { width: 100%; accent-color: var(--accent); margin: 8px 0; }
.modbox summary { cursor: pointer; font: 400 13px/1.4 var(--sans); margin: 4px 0 8px; }
.mods h3 { font: 600 11px/1 var(--sans); color: var(--dim); margin: 10px 0 6px; letter-spacing: .08em; }
.mods div { display: flex; flex-wrap: wrap; gap: 4px; }
.mods button { font: 400 12px/1 var(--sans); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.check { display: flex; align-items: center; gap: 8px; font: 400 13px/1.3 var(--sans); margin-top: 4px; }
.note { font: 400 12px/1.5 var(--sans); color: var(--dim); }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px; text-align: center; font: 400 15px/1.6 var(--sans); }
#err div { max-width: 34em; }
@media (max-width: 700px) {
  #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 58%; }
  .hint { bottom: auto; top: calc(52px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<canvas id="cv"></canvas>
<div class="hud" id="hud"><b>흐름 · 가을</b><span id="fps">—</span></div>
<div class="hint" id="hint">물을 저으면 낙엽이 밀려납니다</div>
<button id="toggle" aria-expanded="true" aria-controls="panel">조절 닫기</button>
<video id="fallback" hidden muted loop playsinline autoplay poster="../img/flowautumn_1.jpg" src="../clip/flowautumn.mp4"></video>
<div id="err" hidden><div id="errmsg"></div></div>

<aside id="panel">
  <section>
    <h2>버전</h2>
    <div class="presets" id="presets"></div>
    <div class="pdesc" id="pdesc"></div>
  </section>
  <section>
    <h2>영상 프리셋 · 키프레임</h2>
    <div class="row"><label for="seqSel">영상 프리셋</label><select id="seqSel"></select></div>
    <ol class="steps" id="steps"></ol>
    <div class="transport">
      <button id="seqPlay">재생</button>
      <label class="check"><input id="seqLoop" type="checkbox" checked> 반복</label>
      <output id="seqTime">0 / 60 초</output>
    </div>
    <input id="seqPos" type="range" min="0" max="60" step="0.05" value="0" aria-label="영상 프리셋 위치">
    <details class="modbox"><summary>조각 넣기 (누르면 끝에 붙음)</summary><div class="mods" id="mods"></div></details>
    <div class="acts">
      <button id="seqNew">새 프리셋 (지금 값에서)</button>
      <button id="seqReset">기본 3개 다시</button>
      <button id="seqCopy" style="grid-column: 1 / -1">영상 프리셋 복사 (영상으로 뽑을 때)</button>
    </div>
  </section>
  <section>
    <h2>가을</h2>
    <div class="row"><label for="nleaf">떠 있는 낙엽 수</label><output for="nleaf"></output><input id="nleaf" type="range" min="0" max="60" step="1"></div>
    <div class="row"><label for="flow">물살 (낙엽이 흘러가는 빠르기)</label><output for="flow"></output><input id="flow" type="range" min="0" max="4" step="0.05"></div>
    <div class="row"><label for="npeople">구경하는 사람 수 (그림자)</label><output for="npeople"></output><input id="npeople" type="range" min="0" max="12" step="1"></div>
    <div class="row"><label for="pshade">그림자 진하기</label><output for="pshade"></output><input id="pshade" type="range" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="specks">물속 부유물</label><output for="specks"></output><input id="specks" type="range" min="0" max="4" step="0.05"></div>
  </section>
  <section>
    <h2>물</h2>
    <div class="row"><label for="slope">물결 세기 (기울기)</label><output for="slope"></output><input id="slope" type="range" min="0" max="0.3" step="0.005"></div>
    <div class="row"><label for="lmin">매끈함 (가장 짧은 물결, m)</label><output for="lmin"></output><input id="lmin" type="range" min="0.05" max="1.2" step="0.01"></div>
    <div class="row"><label for="seed">물결 모양 번호 (같은 성질, 다른 일렁임)</label><output for="seed"></output><input id="seed" type="range" min="1" max="60" step="1"></div>
    <div class="row"><label for="wind">바람 방향 (°)</label><output for="wind"></output><input id="wind" type="range" min="-180" max="180" step="1"></div>
    <div class="row"><label for="nw">물결 가짓수</label><output for="nw"></output><input id="nw" type="range" min="4" max="64" step="1"></div>
    <div class="row"><label for="speed">속도</label><output for="speed"></output><input id="speed" type="range" min="0" max="3" step="0.05"></div>
    <div class="row"><label for="depth">깊이 (m)</label><output for="depth"></output><input id="depth" type="range" min="0.2" max="2" step="0.01"></div>
    <div class="row"><label for="water">물 종류 (Jerlov 분류)</label><select id="water">
      <option value="off">끔 (흡수 없음)</option>
      <option value="I">I · 가장 맑은 대양 (수영장 물에 가장 가까움)</option>
      <option value="IA">IA · 아주 맑은 대양</option>
      <option value="IB">IB · 맑은 대양</option>
      <option value="II">II · 대양</option>
      <option value="III">III · 조금 탁한 대양</option>
      <option value="1">연안 1 · 맑은 바닷가</option>
      <option value="3">연안 3</option>
      <option value="5">연안 5 · 플랑크톤 많은 바닷가</option>
      <option value="7">연안 7</option>
      <option value="9">연안 9 · 흙탕·갈색 바닷가</option>
    </select></div>
    <div class="row"><label for="absorb">물빛 진하기 (1 = 표 그대로)</label><output for="absorb"></output><input id="absorb" type="range" min="0" max="4" step="0.05"></div>
    <div class="row"><label for="veil">뿌연 정도 (물속 입자 산란, 근사)</label><output for="veil"></output><input id="veil" type="range" min="0" max="0.6" step="0.01"></div>
  </section>
  <section>
    <h2>빛 갈라짐</h2>
    <div class="row"><label for="disp">분산 배율 (물 = 1, 작가 기준 7.4)</label><output for="disp"></output><input id="disp" type="range" min="0" max="20" step="0.1"></div>
    <div class="row"><label for="edge">가장자리 무지개 (0 = 순수 물리)</label><output for="edge"></output><input id="edge" type="range" min="0" max="6" step="0.1"></div>
    <div class="row"><label for="nl">파장 수 (3 = RGB 세 겹, 많을수록 무지개가 이어짐)</label><output for="nl"></output><input id="nl" type="range" min="3" max="64" step="1"></div>
  </section>
  <section>
    <h2>해</h2>
    <div class="row"><label for="el">해 높이 (°)</label><output for="el"></output><input id="el" type="range" min="10" max="89" step="1"></div>
    <div class="row"><label for="az">해 방향 (°)</label><output for="az"></output><input id="az" type="range" min="-180" max="180" step="1"></div>
    <div class="row"><label for="caus">빛 무늬 세기</label><output for="caus"></output><input id="caus" type="range" min="0" max="3" step="0.05"></div>
    <div class="row"><label for="amb">그늘 밝기</label><output for="amb"></output><input id="amb" type="range" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="expo">노출</label><output for="expo"></output><input id="expo" type="range" min="0.2" max="3" step="0.05"></div>
  </section>
  <section>
    <h2>바닥 무늬</h2>
    <div class="cways" id="cways"></div>
    <div class="seg"><button id="mGrid" aria-pressed="true">격자</button><button id="mImg" aria-pressed="false">이미지</button></div>
    <div id="gridCtl">
      <div class="row"><label for="tile">타일 크기 (m)</label><output for="tile"></output><input id="tile" type="range" min="0.04" max="0.6" step="0.01"></div>
      <div class="row"><label for="grout">줄눈 굵기 (mm)</label><output for="grout"></output><input id="grout" type="range" min="0" max="40" step="0.5"></div>
      <div class="row"><label for="ga">무늬 A</label><select id="ga"></select></div>
      <div class="row"><label for="gb">무늬 B</label><select id="gb"></select></div>
      <div class="row"><label for="gmix">A → B 섞기 (중간이 새 모양)</label><output for="gmix"></output><input id="gmix" type="range" min="0" max="1" step="0.01"></div>
      <label class="check"><input id="gauto" type="checkbox"> 무늬가 저절로 차례차례 바뀜</label>
      <div class="row"><label for="gper">한 무늬 머무는 시간 (물 시각, 초)</label><output for="gper"></output><input id="gper" type="range" min="3" max="60" step="1"></div>
      <div class="row"><label for="grot">무늬 회전 (°)</label><output for="grot"></output><input id="grot" type="range" min="0" max="90" step="1"></div>
      <div class="row"><label for="gasp">가로 늘이기</label><output for="gasp"></output><input id="gasp" type="range" min="0.4" max="3" step="0.05"></div>
      <div class="row"><label for="bevel">타일 모서리 둥글림</label><output for="bevel"></output><input id="bevel" type="range" min="0" max="2" step="0.05"></div>
      <div class="colors">
        <label>타일 색<input id="c1" type="color"></label>
        <label>타일 색 2<input id="c2" type="color"></label>
        <label>줄눈 색<input id="cg" type="color"></label>
      </div>
    </div>
    <div id="imgCtl" hidden>
      <div class="row"><label for="psize">이미지 한 장 크기 (m)</label><output for="psize"></output><input id="psize" type="range" min="0.1" max="3" step="0.05"></div>
      <label class="file">무늬 이미지 올리기<input id="pfile" type="file" accept="image/*"></label>
      <p class="note" id="pname">이음매 없이 반복되는 정사각형 이미지가 좋습니다. 화면 가로는 약 2.4 m 입니다.</p>
    </div>
  </section>
  <section>
    <h2>손으로 만지기</h2>
    <div class="row"><label for="tstr">터치 물결 세기</label><output for="tstr"></output><input id="tstr" type="range" min="0" max="3" step="0.05"></div>
    <div class="row"><label for="tsize">터치 크기 (cm)</label><output for="tsize"></output><input id="tsize" type="range" min="1" max="20" step="0.5"></div>
    <div class="row"><label for="rdamp">물결이 남는 정도 (클수록 오래)</label><output for="rdamp"></output><input id="rdamp" type="range" min="0.98" max="0.9995" step="0.0005"></div>
    <label class="check"><input id="hover" type="checkbox"> 마우스를 누르지 않고 지나가기만 해도 물결</label>
    <label class="check"><input id="rain" type="checkbox"> 빗방울</label>
  </section>
  <section class="acts">
    <button id="pause">멈춤</button>
    <button id="calm">터치 물결 지우기</button>
    <button id="copy" style="grid-column: 1 / -1">지금 값 복사 (Blender 로 옮길 때)</button>
  </section>
  <p class="note" id="copied" hidden></p>
</aside>

<script>
// 수영장 WebGPU v1.1 — 2026-10-15 (Claude 수영장 버전 세션)
// 원칙: Blender 판(variants_v1)과 같은 물리 정의 — 4 m 주기 파동 합(중력+표면장력 분산, 60초 정수 주기), 코시 물 굴절률 × 분산 배율,
//       정사영 정면, 파장마다 굴절 → 바닥, CIE 가중 합(채널마다 합 1 → 갈라진 곳만 색). 빛 무늬(커스틱)는 3파장 메시 면적비.
// 참고(정호님 10/15): Mancini 「WebGPU Advanced Glass」 — 매끈한 유리 같은 일렁임, 가장자리에서만 이어진 무지개.
const $ = id => document.getElementById(id);
const HASH = location.hash.slice(1);
const PORTFOLIO = false, START = 'V6';   // 고요 인터랙티브판은 START = 'V7'   // 포트폴리오 판(pool_portfolio.html)은 true — 조절판 없음, 빨강 V6 고정, 마우스만 움직여도 물결
const VIEW = PORTFOLIO || ['view', 'calm', 'film'].includes(HASH);   // 한 주소에서 #view · #calm · #film 으로 보기 전용

const LIN = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const ENC = c => c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
const hex2lin = h => [1, 3, 5].map(i => LIN(parseInt(h.substr(i, 2), 16) / 255));
const lin2hex = a => '#' + a.map(c => Math.round(Math.min(1, Math.max(0, ENC(c))) * 255).toString(16).padStart(2, '0')).join('');

const RED = { c1: lin2hex([0.20, 0.004, 0.004]), c2: lin2hex([0.32, 0.010, 0.008]), cg: lin2hex([0.62, 0.62, 0.60]) };
const PRESETS = {
  V1: { edge: 2, d: '빨강 · 유리 물결 — 매끈하고 크게 일렁임, 가장자리에서만 무지개 (참고 영상에 가장 가까움)', expo: 1.0, caus: 2.2, slope: 0.12, lmin: 0.45, nw: 24, el: 52, az: -32, ...RED },
  V2: { edge: 2, d: '빨강 · 유리 물결 세게 · 낮은 해 — 무지개 갈라짐이 가장 강함', expo: 1.0, caus: 2.2, slope: 0.18, lmin: 0.45, nw: 24, el: 40, az: -55, ...RED },
  V3: { edge: 2, d: '흰 바닥 · 회색 줄눈 · 유리 물결 — 밝은 바탕이라 무지개가 가장 잘 보임', expo: 0.5, caus: 1.6, slope: 0.12, lmin: 0.45, nw: 24, el: 52, az: -32,
        c1: lin2hex([0.62, 0.62, 0.60]), c2: lin2hex([0.74, 0.74, 0.72]), cg: lin2hex([0.30, 0.31, 0.33]) },
  V4: { edge: 0, d: '빨강 · 잔잔 · 한낮 — 거의 고요한 물, 줄눈이 살짝 흔들림', expo: 1.0, caus: 2.2, slope: 0.05, lmin: 0.12, nw: 56, el: 75, az: -20, ...RED },

// ── 파동 목록 (make_height.py 와 같은 방식: 4 m 격자로 스냅, 60초 정수 주기, 기울기 RMS 정규화)
const L = 4.0, T = 60.0, MAXW = 128;   // 영상 프리셋에서 두 물결 목록(각 ≤64)을 겹쳐 섞을 때까지
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeWaves(P) {

  const r = mulberry(741001 + 7919 * ((P.seed ?? 1) - 1)), gauss = () => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
  const LMAX = Math.max(P.lmin * 1.5, 2.0), spread = P.lmin > 0.3 ? 55 : 38;
  const W = [];
  for (let i = 0; i < P.nw; i++) {
    const lam = Math.exp(Math.log(P.lmin) + r() * (Math.log(LMAX) - Math.log(P.lmin)));
    const ang = ((P.wind ?? 18) + gauss() * spread) * Math.PI / 180;
    const mx = Math.round(Math.cos(ang) * L / lam), my = Math.round(Math.sin(ang) * L / lam);
    const ph = r() * 2 * Math.PI, ru = 0.55 + 0.45 * r();
    if (mx === 0 && my === 0) continue;
    const k = 2 * Math.PI / L * Math.hypot(mx, my);
    const n = Math.max(1, Math.round(Math.sqrt(9.81 * k + 7.2e-5 * k ** 3) * T / (2 * Math.PI)));
    const ls = 2 * Math.PI / k;
    W.push({ kx: 2 * Math.PI / L * mx, ky: 2 * Math.PI / L * my, w: 2 * Math.PI * n / T, a: 0.0045 * Math.pow(ls / 0.15, 0.85) * ru, ph, mx, my, n });
  }
  const s2 = W.reduce((s, w) => s + (w.a * Math.hypot(w.kx, w.ky)) ** 2, 0);
  const sc = P.slope / Math.sqrt(Math.max(s2 / 2, 1e-12));
  W.forEach(w => w.a *= sc);
  return W;
}

  { name: '색의 순환 (60초)', base: { preset: 'V6' }, steps: [

const SEQ_KEY = 'pool_seqs_v1';
let SEQS = (() => { try { const v = JSON.parse(localStorage.getItem(SEQ_KEY)); if (Array.isArray(v) && v.length) return v; } catch (e) {} return BUILTIN_SEQS(); })();
const saveSeqs = () => { try { localStorage.setItem(SEQ_KEY, JSON.stringify(SEQS)); } catch (e) {} };
let seqI = 0, seqC = null;

const NUMK = Object.keys(P0).filter(k => typeof P0[k] === 'number' && !['ga', 'gb', 'mode', 'nl', 'nw', 'lmin', 'seed', 'wind'].includes(k));
const DISK = ['seed', 'wind', 'nl', 'nw', 'lmin', 'water', 'rain', 'hover', 'gauto', 'mode'];
function blendState(a, b, e) {
  const o = { ...b };
  for (const k of NUMK) o[k] = a[k] + (b[k] - a[k]) * e;
  for (const k of ['c1', 'c2', 'cg']) { const x = hex2lin(a[k]), y = hex2lin(b[k]); o[k] = lin2hex(x.map((v, i) => v + (y[i] - v) * e)); }

    segs.push({ a: st, b: nx, start: time, fade: Math.max(0, +x.fade || 0), hold: Math.max(0, +x.hold || 0) });
    time += segs[segs.length - 1].fade + segs[segs.length - 1].hold; st = nx;
