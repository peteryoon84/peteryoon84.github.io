<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>자유로운 흐름과 자유롭지 않은 벽 — 실시간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 9:16 세로 화면 하나(두꺼운 벽의 방 안 유막) + 오른쪽(휴대폰은 아래) 조종판. 화면 밖은 짙은 무대 */
:root {
  --ink: #e9ecef;
  --ink-soft: #9aa3ad;
  --panel: rgba(18, 21, 25, 0.80);
  --line: rgba(233, 236, 239, 0.14);
  --accent: #8fb8de;
  --stage: #0b0c0e;
  --chip: rgba(255, 255, 255, 0.05);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--f-ui); overflow: hidden; }
#stage { position: fixed; inset: 0; right: 332px; display: grid; place-items: center; padding: 12px; box-sizing: border-box; }
#frame { position: relative; }
#cv { width: 100%; height: 100%; display: block; touch-action: none; border-radius: 4px; }
#msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; line-height: 1.6; }
#panel {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; bottom: 12px; width: 308px;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden;
}
#panel header { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#panel h1 { margin: 0; font-size: 14px; font-weight: 600; }
#toggle { display: none; }
.scroll { overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.vers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ver { text-align: left; font: inherit; font-size: 12.5px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.ver b { font-family: var(--f-num); font-weight: 500; color: var(--accent); }
.ver[aria-pressed="true"] { border-color: var(--accent); background: rgba(143, 184, 222, 0.12); }
#verHint { font-size: 11.5px; color: var(--ink-soft); margin: -6px 0 0; line-height: 1.5; }
.ver:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grp { display: flex; flex-direction: column; gap: 7px; }
.grp h2 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-soft); }
.row { display: grid; grid-template-columns: 74px 1fr 56px; align-items: center; gap: 8px; font-size: 12px; }
.row output { font-family: var(--f-num); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button, #toggle { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
.btns button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
textarea { width: 100%; box-sizing: border-box; height: 64px; font-family: var(--f-num); font-size: 10px; border: 1px solid var(--line); border-radius: 6px; background: rgba(0,0,0,0.3); color: var(--ink); }
.note { font-size: 11px; line-height: 1.55; color: var(--ink-soft); margin: 0; }
@media (max-width: 720px) {
  #stage { right: 0; padding: 0; }
  #panel { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 46%; }
  #panel.closed .scroll { display: none; }
  #toggle { display: inline-block; padding: 3px 8px; }
}
</style>

<div id="stage"><div id="frame">
  <canvas id="cv"></canvas>
  <div id="msg" hidden></div>
</div></div>
<aside id="panel">
  <header><h1>자유로운 흐름과 자유롭지 않은 벽</h1><button id="toggle" type="button">접기</button></header>
  <div class="scroll">
    <div class="vers" id="vers"></div>
    <p id="verHint"></p>
    <div id="presets"></div>
    <div id="sliders"></div>
    <div class="grp">
      <h2>보기</h2>
      <div class="btns">
        <button type="button" id="choreo" aria-pressed="false">60초 안무</button>
        <button type="button" id="pause">멈춤</button>
        <button type="button" id="camMode" aria-pressed="false">카메라</button>
        <button type="button" id="resDown">화질 −</button>
        <button type="button" id="resUp">화질 +</button>

      <p class="note">마우스를 움직이면(휴대폰은 끌면) 빛 구슬이 따라가고, 막은 구슬을 피하고 구슬은 막에 되밀린다. 누르면 그 자리를 찔러 세포가 출렁이고 색 고리가 퍼진다. 덩어리가 벽을 밀면 벽이 불룩해지고(작용) 되밀어 덩어리를 누른다(반작용). 긴장 = 부피가 방에 눌린 정도.</p>
    </div>
  </div>
</aside>

    const a = Math.max(0.35, Math.min(3.2, w / h));
    P.boxX = BASE.boxX * a / A0;
    P.vol = BASE.vol * Math.cbrt(BASE.boxX / P.boxX);
  };
  fitFrame = heroFit; heroFit();
  addEventListener("resize", heroFit);
  let lastWH = "";
  setInterval(() => { const k = innerWidth + "x" + innerHeight; if (k !== lastWH) { lastWH = k; heroFit(); } }, 400);
  // 창 어디서든 포인터가 빛을 끈다(캔버스 밖은 가장자리로 붙음)
  addEventListener("pointermove", (e) => {
    if (e.target === cv) return;
    const r = cv.getBoundingClientRect();
    const cx = Math.max(r.left + 1, Math.min(r.right - 1, e.clientX)), cy = Math.max(r.top + 1, Math.min(r.bottom - 1, e.clientY));
    const [x, y] = ndc({ clientX: cx, clientY: cy, target: cv });
    pointer = { x, y, t: performance.now() };
  });
  // 느린 기기: 처음 2초 뒤 3초 동안 평균 프레임 간격이 45ms 넘으면 알림
  let t0 = 0, n = 0, prev = 0, sum = 0, sent = false;
  const mon = (t) => { if (!t0) t0 = t; if (prev && t - t0 > 2000) { sum += t - prev; n++; } prev = t;
    if (!sent && t - t0 > 5000) { sent = true; if (n && sum / n > 45) tell("slow"); return; } requestAnimationFrame(mon); };
  requestAnimationFrame(mon);
}
init().then(() => tell("ready")).catch((e) => { tell("fail"); const m = $("msg"); m.hidden = false; m.textContent = e.message; });
</script>
