<html lang="ko" data-lang="ko">

<meta charset="utf-8">

<meta property="og:description" content="시선, 빛, 드러나지 않는 매질 — 실시간 시뮬레이션·영상·사진 작업">

<style>
@font-face{font-family:"Wanted Sans";src:url(fonts/WantedSansVariable.woff2) format("woff2");font-weight:400 900;font-display:swap}
/* 색인: 머리띠에 모든 작품이 늘 떠 있고(이케다 료지), 상세는 글·작품 정보 왼쪽 / 영상·사진 오른쪽(로사노헤머).
   대담함은 색인 한 곳에만. 나머지는 흰 종이와 검은 글씨, 작품 색만. */
:root{
  --paper:#f0f1f0;     /* 바탕 — 유막 방 벽에 맞춘 옅은 회백 */
  --ink:#1f2123;       /* 글 — 먹색 */
  --quiet:#66696b;     /* 보조 글 (바탕 위 5:1) */
  --rule:#d2d4d3;      /* 색인 칸 위 가는 선 */
  --accent:#8fb3c9;    /* 강조 하나 — 유막 막 가장자리의 옅은 청회색 (선·표시에만, 글자에는 안 씀) */
  --wall:#c5c6c5;      /* 유막 방 벽 색 — 첫 화면 영상 양옆 */
  --dark:#e3e5e4;      /* 영상·사진 뒤(불러오는 동안) — 어둡지 않게 */
  --gut:20px;
  color-scheme:light;
}
*{margin:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--paper);color:var(--ink);font-family:"Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
a{color:inherit;text-decoration:none}
h1,h2,h3,b{text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
html[data-lang="ko"] [lang="en"]{display:none!important}
html[data-lang="en"] [lang="ko"]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gut) 0}
.top .name{font-weight:650;font-size:14px}
.top nav{display:flex;gap:22px;color:var(--quiet)}
.top nav a[aria-current="page"],.top nav a:hover{color:var(--ink)}
.top nav button{color:var(--quiet)}.top nav button[aria-pressed="true"]{color:var(--ink);font-weight:600}

/* 색인 */
.idx{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));column-gap:12px;row-gap:10px;padding:12px var(--gut) 14px;border-bottom:1px solid var(--ink)}
.idx a{display:block;border-top:1px solid var(--rule);padding-top:5px;min-width:0}
.idx a span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.idx a small{display:block;color:var(--quiet);font-size:11.5px;font-variant-numeric:tabular-nums}
.idx a:hover span{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.idx a[aria-current="true"]{border-top:3px solid var(--accent);padding-top:3px}

/* 첫 화면 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:20px var(--gut) 24px;height:calc(100svh - var(--top,150px));min-height:460px}
.stage .m{position:relative;background:var(--dark);min-height:0}
.stage .m video,.stage .m img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage .m.tall video,.stage .m.tall img{object-fit:contain}
.stage .side{display:flex;flex-direction:column;justify-content:flex-end}
.stage h1{font-size:26px;font-weight:650;line-height:1.2;letter-spacing:-.01em}
.stage .line{margin:6px 0 16px;color:var(--quiet)}
.stage p{font-size:14px;line-height:1.7;max-width:34ch}
.stage .go{margin-top:18px;align-self:flex-start;border-bottom:2px solid var(--accent);font-weight:500}
.stage .m.hero{background:transparent}
.stage .m.hero iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--paper)}
.stage .m.hero video,.stage .m.hero img{object-fit:contain}
.stage .hint{margin-top:10px;color:var(--quiet);font-size:12px}

/* 작품 상세 */
.work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-areas:"head media" "body media";grid-template-rows:auto 1fr;column-gap:48px;padding:28px var(--gut) 72px;max-width:1440px}
.work .head{grid-area:head}.work .body{grid-area:body}.work .media{grid-area:media;min-width:0}
.work h1{font-size:30px;font-weight:650;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.work .line{margin:6px 0 22px;color:var(--quiet)}
.work .badge{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;color:var(--quiet);vertical-align:4px}
.work p{font-size:14.5px;line-height:1.75;margin-bottom:1em;max-width:46ch}
.work h2{font-size:13px;font-weight:600;margin:28px 0 8px;padding-top:8px;border-top:1px solid var(--ink)}
.work table{border-collapse:collapse;width:100%;font-size:13px}
.work th{text-align:left;font-weight:400;color:var(--quiet);width:6.5em;vertical-align:top;padding:5px 12px 5px 0}
.work td{padding:5px 0;vertical-align:top}
.work .links a{display:table;margin-top:6px;border-bottom:1px solid var(--ink)}
.media figure{margin:0 0 22px}
.media img{display:block;width:100%;height:auto;background:#e3e5e4}
.media video{display:block;max-width:100%;max-height:80svh;width:auto;height:auto;background:var(--dark)}
.media figcaption{margin-top:6px;color:var(--quiet);font-size:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager{display:flex;justify-content:space-between;gap:20px;margin-top:40px;padding-top:10px;border-top:1px solid var(--rule)}
.pager a span{display:block;color:var(--quiet);font-size:12px}.pager a b{font-weight:500}
.pager a:last-child{text-align:right}

/* 글·이력·연락 */
.page{padding:28px var(--gut) 72px;max-width:1200px}
.page>h1{font-size:30px;font-weight:650;margin-bottom:24px}
.statement{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px}
.statement blockquote{font-size:22px;line-height:1.5;font-weight:500;text-wrap:balance}
.statement cite{display:block;margin-top:14px;font-style:normal;font-size:12px;color:var(--quiet)}
.statement .txt p{font-size:14.5px;line-height:1.8;margin-bottom:1.1em;max-width:58ch}
.statement .txt h3{font-size:13px;font-weight:600;margin:28px 0 8px;padding-top:8px;border-top:1px solid var(--ink)}
.cv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
.cv h3{font-size:13px;font-weight:600;padding-top:8px;border-top:1px solid var(--ink);margin-bottom:6px}
.cv ul{list-style:none;padding:0}
.cv li{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:12px;padding:5px 0;font-size:13.5px;line-height:1.55}
.cv li>span:first-child{color:var(--quiet);font-variant-numeric:tabular-nums}
.cv em{font-style:normal;color:var(--quiet)}
.contact .big{font-size:clamp(26px,4.4vw,56px);font-weight:600;letter-spacing:-.01em;word-break:break-all;user-select:all}
.contact p{margin-top:10px;color:var(--quiet);font-size:14px}
.contact button{margin-top:22px;border-bottom:1px solid var(--ink);font-weight:500}
/* 첫 화면: 실시간 방이 화면 전체, 글은 왼쪽 아래 모서리 */
.hero{position:relative;height:calc(100svh - 44px);min-height:480px;background:var(--wall)}
.hero .m{position:absolute;inset:0;overflow:hidden;background:var(--wall)}
.hero .m iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.hero .m video,.hero .m img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.hero .cap{position:absolute;left:var(--gut);bottom:24px;max-width:340px;padding:16px 18px;background:rgba(240,241,240,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero h1{font-size:22px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.hero .line{margin:4px 0 10px;color:var(--quiet);font-size:12.5px}
.hero p{font-size:13.5px;line-height:1.65}
.hero .go{display:inline-block;margin-top:12px;border-bottom:2px solid var(--accent);font-weight:500}
.hero .hint{margin-top:8px;color:var(--quiet);font-size:12px}
.works{padding:40px var(--gut) 56px}
.works h2{font-size:13px;font-weight:600;padding-top:8px;border-top:1px solid var(--ink);margin-bottom:16px}
.works ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 20px}
.works a{display:block}
.works img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--dark);margin-bottom:8px}
.works b{display:block;font-weight:600;font-size:14px;line-height:1.35}
.works small{display:block;margin-top:3px;color:var(--quiet);font-size:12px;line-height:1.4}
.works a:hover b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
@media (max-width:620px){
  .hero{height:auto;min-height:0;background:none}
  .hero .m{position:relative;inset:auto;height:78svh;background:var(--wall)}
  .hero .cap{position:static;max-width:none;padding:16px var(--gut) 0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .works ul{grid-template-columns:1fr 1fr;gap:22px 12px}
}
.works h2{display:flex;align-items:baseline;gap:8px}
.works h2 span{color:var(--quiet);font-weight:400;font-size:12px}
.works ul+h2{margin-top:48px}
.works small.with{color:var(--ink);font-weight:500}
.work .line.with{margin-top:-16px;margin-bottom:22px;color:var(--ink);font-weight:500}
.hero .scroll{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink);padding:6px 10px;background:rgba(240,241,240,.72);border-radius:999px}
.hero .scroll i{width:9px;height:9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-3px}
@media (prefers-reduced-motion:no-preference){.hero .scroll i{animation:nudge 2.4s ease-in-out infinite}}
@keyframes nudge{0%,60%,100%{transform:translateY(0) rotate(45deg)}30%{transform:translateY(3px) rotate(45deg)}}
@media (max-width:620px){.hero .scroll{bottom:auto;top:calc(78svh - 44px)}}
.mlist{display:none}
footer{padding:14px var(--gut) calc(14px + env(safe-area-inset-bottom,0px));color:var(--quiet);font-size:12px;border-top:1px solid var(--rule)}

@media (max-width:900px){
  .idx{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stage{grid-template-columns:1fr;height:auto;gap:14px}.stage .m{aspect-ratio:16/9}
  .stage .m.hero{aspect-ratio:9/16;height:auto;width:min(100%,calc(74svh * 9 / 16));margin:0 auto}
  .work{grid-template-columns:1fr;grid-template-areas:"head" "media" "body";padding-top:18px}
  .statement,.cv{grid-template-columns:1fr;gap:28px}
}
@media (max-width:620px){
  :root{--gut:16px}
  .top nav{gap:14px}
  .idx{display:flex;overflow-x:auto;gap:14px;scrollbar-width:none;overscroll-behavior-x:contain}
  .idx::-webkit-scrollbar{display:none}
  .idx a{flex:0 0 auto;max-width:9.5em}
  .media video{width:100%;max-height:none}
  .media .tallv{max-width:78%;margin:0 auto}
  .pair{grid-template-columns:1fr}
  .mlist{display:block;list-style:none;padding:8px var(--gut) 40px;border-top:1px solid var(--ink);margin-top:8px}
  .mlist li a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
  .mlist img{width:96px;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}
  .mlist b{display:block;font-weight:600;font-size:14px;line-height:1.3}
  .mlist small{display:block;margin-top:3px;color:var(--quiet);font-size:12px;line-height:1.4}
}
</style>

<template id="t-note"><section class="page"><h1><span lang="ko">글</span><span lang="en">Statement</span></h1>
<div class="statement">
      <blockquote>
        <span lang="ko">“희망이나 이상을 나타내는 빛은 오히려 개인의 정체성을 없애버리는 것 같다.”</span>
        <span lang="en">“The light that stands for hope and ideals seems, if anything, to erase a person’s identity.”</span>
        <cite><span lang="ko">작가 노트 중, 2019</span><span lang="en">From the artist’s notes, 2019</span></cite>
      </blockquote>
      <div class="txt">
        <div lang="ko">
          <p>가끔 “그 사람은 한마디로 어떤 사람이야?”라는 질문을 받는다. 이름, 나이, 성별, 가족, 학교, 지역, 직업. 사람을 이루는 것들 가운데 영원한 것은 없다. 그래서 한 사람의 정체성은 규격화된 틀 안에서 설명할 수 없다고 생각한다.</p>
          <p>나의 작업은 사람이 대상을 일반화하고 단편적으로 규정하려는 경향에서 출발한다. 우리는 규정되지 않은 공백, 이성으로 판단할 수 없는 유령 같은 상태를 두려워한다. 그러나 그렇게 규정된 대상도 시간과 기술에 의해 계속 바뀐다.</p>
          <p>작업의 주제는 타자의 응시다. 플래시의 빛으로 일반화된 인물을 드러내고, 결코 동일해질 수 없는 개인의 초상을 남긴다. 전시장에서는 사진을 철제 좌대 위에 두고 관람객이 루페로 허리를 숙여 들여다보게 한다. 보는 행위가 곧 대상화라는 것을, 관람의 몸짓으로 겪게 하려는 것이다.</p>
          <h3>2026 —</h3>
          <p>최근에는 같은 질문을 매질로 옮기고 있다. 기름 막의 두께, 수영장 물면의 높이처럼 드러나지 않는 매질의 모양을 통해 빛의 흐름을 보이게 한다. 구조가 존재를 누르고, 눌려 찢어지는 자리에서 빛은 성분(RGB)으로 나뉜다. 기계는 그것을 세고 분류하려 하지만 측정은 끝내 실패한다.</p>
        </div>
        <div lang="en">
          <p>People sometimes ask me, “So what kind of person is he, in a word?” Name, age, gender, family, school, region, occupation: none of the things that make up a person is permanent. That is why I believe identity cannot be explained inside a standardised frame.</p>
          <p>My work starts from our habit of generalising and defining others by fragments. We fear the blank, the ghost-like state that reason cannot settle. Yet even what we have defined keeps changing with time and technology.</p>
          <p>The subject of the work is the gaze of others. With the light of a camera flash I reveal generalised figures and leave portraits of individuals who can never be made identical. In the gallery the prints lie on steel plinths and visitors must bend over them with a loupe, so that looking itself is felt as an act of objectification.</p>
          <h3>2026 —</h3>
          <p>Recently I have carried the same question into media themselves. Through the hidden shape of a medium, the thickness of an oil film or the height of a pool’s surface, I make the flow of light visible. Structure presses on existence, and where it tears, light splits into its components, R, G and B. A machine tries to count and classify it, and the measurement always fails.</p>
        </div>
      </div>
    </div>
</section></template>
<template id="t-cv"><section class="page"><h1><span lang="ko">이력</span><span lang="en">CV</span></h1>
<p style="color:var(--quiet);margin:-14px 0 24px"><span lang="ko">1984년생, 대구에서 활동</span><span lang="en">b. 1984, works in Daegu</span></p>
<div class="cv">
      <div>
        <h3><span lang="ko">개인전</span><span lang="en">Solo Exhibitions</span></h3>
        <ul>
          <li><span>2020.11</span><span>Ge-Stell (세움몰이) <em>— <span lang="ko">스페이스바, 서울</span><span lang="en">Space BA, Seoul</span></em></span></li>
          <li><span>2019.11</span><span>Ge-Stell <em>— <span lang="ko">SpaceBA, 영남대학교</span><span lang="en">SpaceBA, Yeungnam University</span></em></span></li>
          <li><span>2019.06</span><span><span lang="ko">시선이 지나간 자리</span><span lang="en">Where the Gaze Has Passed</span> <em>— <span lang="ko">문화장 × 더더프로젝트, 대구</span><span lang="en">Munhwajang × The The Project, Daegu</span></em></span></li>
          <li><span>2019.02</span><span>Stereo Lithography <em>— <span lang="ko">비영리전시공간 싹, 대구</span><span lang="en">Alternative Space SSAC, Daegu</span></em></span></li>
        </ul>
      </div>
      <div>
        <h3><span lang="ko">단체전 · 페스타</span><span lang="en">Group Exhibitions · Festivals</span></h3>
        <ul>
          <li><span>2026.05</span><span><span lang="ko">제7회 극재 포럼 — 극재 정점식 3면 미디어아트</span><span lang="en">7th Gukje Forum — three-screen media work on Jeong Jeom-sik</span> <em>— <span lang="ko">계명대학교 동산관, 대구</span><span lang="en">Keimyung University, Daegu</span></em></span></li>

 txt:{"ko": ["본 작업은 본인이 나트랑의 한 수영장에서 촬영한 사진 한 장에서 출발한다. 수면을 통과한 빛은 바닥의 규격화된 격자를 휘게 하고, 그 경계인 줄눈 위에서만 파장마다 다른 길로 갈라져 색으로 드러난다. 본인은 이것을 「빛의 흐름을, 드러나지 않는 매질의 모양을 통해 보이게 한다」라는 문장으로 정리하였다.", "아무도 없을 때 물은 멈추고 격자는 곧은 채로 남지만, 관람자가 다가가 수면을 건드리는 순간 구조는 휘고 하나의 빛은 여러 색으로 분절된다."], "en": ["This work begins with a single photograph I took at a swimming pool in Nha Trang. Light passing through the water's surface bends the standardized grid of the floor, and only along its boundaries, the grout lines, does it split into separate paths by wavelength and appear as color. I summarized this in one sentence: \"to make the flow of light visible through the shape of an unseen medium.\"", "When no one is present, the water is still and the grid remains straight; the moment a viewer approaches and touches the surface, the structure bends and a single light is fragmented into many colors."]},

 txt:{"ko": ["「흐름」의 수영장에 가을이 내려앉았다. 물 위에는 단풍잎 두 장이 떠서 어떤 갈래는 물에 잠기고 어떤 갈래는 들린 채 물살을 따라 흐르고, 수면에는 나뭇잎 그림자 대신 수영장 밖에서 물을 내려다보는 사람들의 실루엣이 비친다.", "그 그림자는 햇빛을 막은 자리일 뿐이어서, 물결을 지나며 바닥에 닿을 때에는 이미 휘고 흩어져 누구인지 알아볼 수 없다. 본인은 보는 이가 보이는 것의 일부가 되는 순간을, 드러나지 않는 매질이 그 모습을 지우고 다시 그리는 과정으로 보여주고자 한다."], "en": ["Autumn has settled on the pool of Flow. Two maple leaves float on the water, some lobes sinking beneath the surface while others lift above it, as they drift with the current. Instead of the shadows of leaves, the surface carries the silhouettes of people standing outside the pool and looking down at the water.", "Because these shadows are only places where sunlight has been blocked, by the time they pass through the waves and reach the floor they are already bent and scattered beyond recognition. I wanted to show the moment when the viewer becomes part of what is seen, as a process in which an invisible medium erases that figure and draws it again."]},

 txt:{"ko": ["본 작업은 「흐름」의 수영장 위에 해 질 녘의 윤슬을 얹은 실시간 시뮬레이션이다. 수면의 잔물결이 해와 눈 사이의 반사각에 맞는 순간에만 빛은 한 점으로 반짝이고, 그 반짝임은 계산된 확률로 나타났다 사라진다.", "본인은 해의 높이는 그대로 두고 빛의 색만 해 질 녘의 대기를 지나온 빛으로 바꾸어, 위에서 내려다보는 시선과 저무는 빛이 한 화면에 함께 머물게 하였다. 「윤슬」은 햇빛이나 달빛에 비치어 반짝이는 잔물결을 뜻하는 우리말이다."], "en": ["This work is a real-time simulation that lays the glitter of a setting sun, yunseul, over the swimming pool of Flow. Light flashes as a single point only at the moment a ripple on the surface meets the angle of reflection between the sun and the eye, and each flash appears and vanishes with a calculated probability.", "Keeping the sun high, I changed only the color of its light to that of light passing through the evening atmosphere, so that a gaze looking down from above and a fading light remain together in one frame. Yunseul is a Korean word for ripples glittering in sunlight or moonlight."]},
 links:[{"href": "live/flow-yunseul.html#view", "ko": "실시간판 열기", "en": "Open real-time version"}]},

 txt:{"ko": ["공공 아카이브에 「신원 미상」으로 남은 1840–1920년대의 초상 사진 60점을 모아, 얼굴만 빛으로 태워 지웠다. 긴 노출 동안 고개가 조금씩 흔들려 같은 얼굴이 여러 번 기록되고, 겹칠수록 하얗게 타버린다.", "사진은 사람을 드러내는 동시에 일반화하고 지운다 — 2018년 「human plurality」에서 플래시가 하던 일을, 이번에는 기록 자체의 시간이 한다. 각 작품의 캡션에는 기관이 붙인 분류어와 소장번호를 그대로 남긴다. 프린트: 61×91 외."], "en": ["Sixty portrait photographs from the 1840s–1920s, catalogued in public archives as \"unidentified,\" have had only their faces burned away by light. During the long exposure the head drifts slightly, the same face is recorded again and again, and where the records overlap it burns to white.", "Photography reveals a person while generalising and erasing them — what the flash did in human plurality (2018), the duration of recording itself now does. Each caption keeps the institution's own classification terms and accession number. Prints: 61×91 cm and others."]}},

 spec:{"ko": [["매체", "AI 영상, 흑백, 사운드"], ["판", "v6 (2026-10-16 확정)"], ["길이·규격", "3분, 1080p (원 소스 4K)"], ["도구", "Higgsfield API — MiniMax H3·Kling 3.0·Seedance 2.0(영상 생성), Topaz Video AI(보간·4K), Google Lyria 3 Pro(음악), 편집·모션그래픽은 Python/OpenCV 자체 스크립트"], ["이어지는 작품", "「시선이 지나간 자리 #1」(2019, 단채널 비디오 설치, 03:47, 개인전, 문화장 × 더더프로젝트, 대구)"]], "en": [["Medium", "AI-generated video, black and white, sound"], ["Version", "v6 (final, 16 Oct 2026)"], ["Format", "3 min, 1080p (4K source)"], ["Tools", "Higgsfield API — MiniMax H3, Kling 3.0, Seedance 2.0 (video generation); Topaz Video AI (interpolation, 4K); Google Lyria 3 Pro (music); editing and motion graphics with custom Python/OpenCV scripts"], ["Related work", "Where the Gaze Has Passed #1 (2019, single-channel video installation, 03:47, solo exhibition, Munhwajang × The The Project, Daegu)"]]},
 txt:{"ko": ["흰 방과 검은 방에 마주 앉은 두 사람은 말 대신 손으로 동그라미·세모·네모를 써서 건넨다. 기호는 접히고 펼쳐지고 TV 화면을 거쳐 확대경 아래로 옮겨 가는데, 들여다볼수록 코드처럼 뒤바뀌어 끝내 읽히지 않는다.", "정적인 응시와 교차편집, 몰아치는 몽타주가 묵직한 비트 위에서 번갈아 나타나고, 두 사람은 가운데 TV가 켜져 있는 동안만 서로를 마주 본다. 2019년 영상 설치에서 시작해 2021년 스토리보드로 그린 생각을 2026년의 생성형 AI로 다시 만든 작업이다. 화면 속 모든 장면은 AI가 만들었다."], "en": ["Two people sit facing each other across a white room and a black room. Instead of speaking, they write circles, triangles and squares by hand and pass them across. The symbols are folded, unfolded, relayed through a television screen and placed under a magnifying glass, and the closer they are examined, the more they shift like code until they can no longer be read.", "Still gazes, cross-cutting and a driving montage alternate over a heavy beat, and the two meet each other's eyes only while the television between them is on. Begun as a 2019 video installation and drawn as a storyboard in 2021, the idea is remade here in 2026 with generative AI; every image on screen was made by AI."]}},

 spec:{"ko": [["판", "v7 (100명, 2026-10-16)"], ["매체", "세로 단채널 영상 — 생성형 AI 인물 이미지, 디퓨전 노이즈 소거(자체 제작 코드), After Effects 구성"], ["길이·규격", "30초(제작 중 연출판), 1080×1920 세로(9:16), 24fps, 무음, 채도를 크게 낮춘 컬러, 100명(8×13)"], ["인물", "등장하는 얼굴은 모두 AI로 생성한 가상 인물이며, 실존 인물이 아니다"], ["관련", "human plurality (2018)를 잇는 영상 연작"], ["상태", "제작 중"]], "en": [["Version", "v7 (100 faces, 16 Oct 2026)"], ["Medium", "Vertical single-channel video — AI-generated portrait images, diffusion-noise erasure (custom code), composited in After Effects"], ["Format", "30 s (work-in-progress cut), 1080×1920 vertical (9:16), 24 fps, silent, heavily desaturated colour, 100 faces (8×13)"], ["Faces", "All faces are AI-generated; none depicts a real person"], ["Related", "Video series following human plurality (2018)"], ["Status", "In progress"]]},
 txt:{"ko": ["증명사진처럼 놓인 얼굴들이 하나의 장(場)을 이룬다. 한 칸 안에서는 한 사람의 여러 표정과 몸짓이 빠르게 넘어가다가 정면에서 멈추고, 얼굴의 한쪽에서 시작된 노이즈는 AI 디퓨전이 이미지를 만들고 지우는 과정처럼 번져 가고, 이목구비는 입자로 흩어진 뒤 매끈한 피부면으로 가라앉았다가 다시 떠오른다.", "2018년 「human plurality」에서 플래시 빛이 얼굴을 지웠다면, 이 작업에서는 계산된 노이즈가 그 자리를 대신한다. 백 명의 얼굴이 놓인 장 안에서는 늘 서른에서 마흔 칸이 지워지거나 돌아오고 있어, 개별 초상은 끝내 누구도 아닌 복수의 얼굴로 흔들린다."], "en": ["Faces laid out like ID photographs form a single field. Within each frame, one person's many expressions and gestures flicker past and halt facing forward; then noise that begins on one side of the face spreads like the process by which AI diffusion makes and unmakes an image; features scatter into particles, settle into a smooth surface of skin, and then surface again.", "Where the flash of light erased the face in human plurality (2018), computed noise takes its place here. In a field of a hundred faces, thirty to forty are being erased or returning at any moment, so that each portrait keeps wavering into a plurality of faces that belong to no one."]}},

 spec:{"ko": [["작가", "윤정호 · 하선혜 (협업)"], ["매체", "세로 단채널 영상 — 생성형 AI 이미지(16종 × 10감정 × 압축 3단계, 정지 480장), 생성형 AI 영상(Kling, 63편), After Effects 구성(레이어 1,650개), 음악 Google Lyria, 효과음 직접 합성"], ["규격", "27.6초, 2160×3840(9:16), 24fps, 스테레오 — 65인치 세로 4K 화면에서 토끼 한 마리가 약 5 cm가 되도록 마지막 장면을 16열 × 29행(464마리)으로 설계"]], "en": [["Artists", "Yoon Jung Ho and Ha Sun-hye (collaboration)"], ["Medium", "Vertical single-channel video — generative-AI images (16 rabbits × 10 emotions × 3 levels of compression, 480 stills), generative-AI video (Kling, 63 clips), composited in After Effects (1,650 layers), music by Google Lyria, synthesized sound effects"], ["Format", "27.6 s, 2160×3840 (9:16), 24 fps, stereo — the final 16 × 29 grid (464 rabbits) is sized so each rabbit is about 5 cm on a 65-inch vertical 4K screen"]]},
 txt:{"ko": ["투명한 상자에 몸이 꽉 끼어 눌린 토끼 한 마리가 있다. 눌린 얼굴은 귀엽다고 소비되고, 귀여움이 늘어나는 만큼 같은 압력을 견디는 토끼도 늘어난다.", "칸이 쪼개질 때마다 토끼들은 서로를 밀어내며 「띠용」 튀어나오고, 화면이 가득 차면 개별 얼굴은 사라지고 털색이 만드는 무늬만 남는다. 본 작업은 눌림이라는 압력이 귀여움의 콘텐츠로 생산되고 소비되는 구조를, 끝없이 복제되는 격자로 보여 준다."], "en": ["A rabbit is squeezed tight inside a clear box. Its pressed face is consumed as cute, and as the cuteness multiplies, so do the rabbits enduring the same pressure.", "Each time the grid splits, the rabbits push one another aside and pop out with a boing; once the screen is full, individual faces disappear and only the pattern of their fur remains. This work shows, through an endlessly replicating grid, how the pressure of being pressed is produced and consumed as cute content."]}},

 txt:{ko:["타자의 시선이 만드는 폭력은 개인의 문제를 넘어 사회 현상이 된다. 그 시선의 대표가 텔레비전이다. 작품은 미디어의 시선이 한 개인을 일반화했던 몇몇 사건을 모티브로 한다.","3분 동안 세 가지 시선이 한 화면에 놓인다. 6시간을 관찰한 아파트, TV를 응시하는 얼굴 없는 개인, 그리고 완벽히 대상화되고 규정되어 만들어진 10만 개의 가상 얼굴. 공인이란 존재하는가, 아니면 우리 모두가 공인인가를 묻는다."],en:["The violence of other people’s gaze outgrows the personal and becomes a social phenomenon, and television is its emblem. The work draws on incidents in which the media’s gaze generalised an individual.","For three minutes three gazes share one screen: an apartment block observed for six hours, a faceless person staring at a TV, and one hundred thousand synthetic faces, fully objectified and defined. It asks whether a ‘public figure’ exists at all, or whether we all are one."]}},

 txt:{"ko": ["극재 정점식 화백의 드로잉을 세 면을 잇는 10미터 너비의 화면으로 옮겼다. 화백의 기법을 「긁어냄」으로 읽어, 어두운 바탕을 긁어 내면 획이 드러나는 순서로 그림이 다시 그려지게 했다."], "en": ["Drawings by Jeong Jeom-sik (pen name Gukje) carried onto a ten-metre image joining three screens. Reading his technique as scraping, the drawings are redrawn in the order in which strokes emerge as the dark ground is scraped away."]}},

 txt:{"ko": ["변미영 작가의 회화와 윤정호의 영상, 길기판의 사운드가 만난 협업전이다. 회화 속 꽃과 산, 봉황이 벽과 바닥으로 흘러내려 전시장 전체가 한 폭의 무릉도원이 된다. 1전시실은 모니터 다섯 대로, 2전시실은 미디어 파사드로 꾸몄다.", "「변미영 작가의 작품을 통한 미디어 파사드는 시간성을 조각하는 디지털 회화다.」 — 작가노트, 전시 도록에서"], "en": ["A collaborative exhibition bringing together Byun Mi-young's paintings, Yoon Jung Ho's video and Gil Ki-pan's sound. Flowers, mountains and phoenixes from the paintings flow down the walls and across the floor until the whole gallery becomes one Mureungdowon. Room 1 holds five monitors; Room 2 is a media façade.", "\"A media façade made through Byun Mi-young's work is a digital painting that sculpts time.\" — artist's note, from the exhibition catalogue"]}},

 txt:{"ko": ["변미영 작가의 「판타지아 무릉도원」을 바탕으로 봄, 여름, 가을, 겨울을 계절별 영상으로 만들었다. 가로로 긴 파사드 위에서 동물과 꽃이 네 계절을 차례로 지나고, 세로 LED에서는 계절마다 짧은 장면이 이어진다."], "en": ["Seasonal videos for spring, summer, autumn and winter, made from Byun Mi-young's Fantasia Mureungdowon. Across a long horizontal façade, animals and flowers pass through the four seasons, while vertical LED screens carry a short scene for each season."]}},

 txt:{"ko": ["근대 거장의 원작을 오늘의 미디어로 옮기는 「원작 컨버팅」 작업이다. 이강소의 「페인팅 78-1」은 전위의 충격을 온몸으로 겪은 경험이 몸의 그림, 곧 퍼포먼스로 이어진 작업이다.", "그 충격을 정연한 형식으로 옮겨, 행위의 흔적과 시간의 매체성을 미디어로 다시 읽었다."], "en": ["Part of a programme converting the original works of modern masters into today's media. Lee Kang-so's Painting 78-1 is a work in which the shock of the avant-garde, felt through the whole body, became a painting made by the body: a performance.", "The shock is carried into an ordered form, reading the traces of action and the mediality of time anew through media."]}},

 txt:{ko:["김병종 화백의 화면을 미술관 외벽의 긴 띠와 실내 벽면으로 옮겼다. 두터운 마티에르와 꽃의 붉은색이 빛이 되어 건물과 방을 덮는다."],en:["Kim Byung-jong’s paintings were moved onto the long strip of the museum’s façade and its interior walls. The heavy matière and the red of the flowers become light that covers the building and the room."]}},

 t:{ko:"human plurality",en:"human plurality"},alt:{ko:"인간의 복수성",en:"인간의 복수성"},
 md:{ko:"잉크젯 프린트, 철제 좌대, 루페",en:"Inkjet print, steel plinth, loupe"},
 img:["plural_1.jpg","plural_5.jpg","plural_4.jpg","plural_2.jpg","plural_6.jpg","plural_7.jpg","plural_3.jpg"],
 cap:{ko:["human plurality, 잉크젯 프린트, 61×91cm","루페로 들여다보는 사진 설치","철제 좌대 설치","설치 전경, 대구, 2019","루페 아래의 초상","루페 아래의 초상","여러 겹으로 쌓인 한 사람의 초상"],en:["human plurality, inkjet print, 61×91 cm","Photo installation viewed through a loupe","Installation on steel plinths","Installation view, Daegu, 2019","Portrait under the loupe","Portrait under the loupe","A single portrait built from many layers"]},
 spec:{ko:[["매체","잉크젯 프린트, 사진 설치"],["크기","61 × 91 cm"]],en:[["Medium","Inkjet print, photo installation"],["Size","61 × 91 cm"]]},
 txt:{ko:["제목은 한나 아렌트의 『인간의 조건』에 나오는 ‘복수성’에서 빌렸다. 여러 겹으로 쌓인 흐릿한 한 사람의 초상은 이상적인 인간상에 재단되어 평면이 되어 버린 우리의 모습이다.","작업에서 카메라는 타자의 시선이다. 플래시 빛에 얼굴이 사라지며 일반화가 일어난다. 관람객은 철제 좌대 위의 사진을 루페로 들여다본다. 확대된 대상은 더 이상 추측할 수 있는 사람이 아니라 인화지 표면의 디지털 이미지가 되고, 그것을 보는 동안 시선의 폭력은 계속된다."],en:["The title borrows ‘plurality’ from Hannah Arendt’s The Human Condition. A blurred portrait of one person, layered many times over, is us: cut to fit an ideal and flattened.","The camera here is the gaze of others; the flash erases the face and generalises it. Visitors look at the prints on steel plinths through a loupe. Magnified, the subject is no longer a person one can guess at but a digital image on the paper’s surface, and while we look, the violence of the gaze goes on."]}},

 txt:{ko:["사회에서 외면되는 일상적인 시선의 폭력에 대한 영상이다. 내가 자란 80년대에는 부모와 선생님의 말이 절대적이었고, 모난 부분은 제거해야 할 대상이었다.","폭력적 시선에 괴로워하고 도망치는 개인이 일반화되는 과정을 퍼포먼스 영상으로 찍고, 시간을 되돌리는 형식으로 엮었다. 대상화되고 분절된 개인의 정체성은 시간이 지나며 새로운 차이를 만들고 증식한다."],en:["A video about the everyday violence of the gaze that society looks away from. Growing up in the 1980s, the words of parents and teachers were absolute, and anything that stuck out was to be removed.","I filmed, as performance, an individual tormented by that gaze and fleeing it, and edited it to run backwards in time. An identity that has been objectified and fragmented goes on, with time, to produce new differences and multiply."]}},

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yv=w=>+(w.year.match(/\d{4}/g)||[0]).pop();
const LIST=WORKS.slice().sort((x,y)=>yv(y)-yv(x));
const FEATURE="yumak";
let LANG="ko";
try{const s=localStorage.getItem("yjh-lang");if(s==="en"||s==="ko")LANG=s}catch(e){}
const yr=w=>w.year.replace("2023–2024","2023–24").replace("2011–2019","2011–19");

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function media(w,cls,still){
  if(w.clip&&still&&RM)w={...w,clip:null};
  return w.clip
    ?`<video src="clip/${w.clip}" poster="img/${w.img[0]}" ${RM?"controls":"autoplay"} muted loop playsinline preload="metadata"${cls?` class="${cls}"`:""}></video>`
    :`<img src="img/${w.img[0]}" alt="${esc(w.t[LANG])}" decoding="async">`;
}

function renderIndex(){}
function worksList(){
  const card=x=>`<li><a href="#w/${x.id}"><img src="img/${x.img[0]}" alt="" loading="lazy" decoding="async"><b>${esc(x.t[LANG])}</b>${x.collab?`<small class="with">${LANG==="ko"?"함께":"with"} ${esc(x.collab[LANG])}</small>`:""}<small>${yr(x)} · ${esc(x.md[LANG])}</small></a></li>`;
  const solo=LIST.filter(x=>!x.collab),col=LIST.filter(x=>x.collab);
  return `<section class="works" id="works" aria-label="${LANG==="ko"?"작업":"Works"}">
    <h2 id="solo-h">${LANG==="ko"?"개인 작업":"Solo Works"}<span>${solo.length}</span></h2><ul aria-labelledby="solo-h">${solo.map(card).join("")}</ul>
    <h2 id="collab-h">${LANG==="ko"?"협업":"Collaborations"}<span>${col.length}</span></h2><ul aria-labelledby="collab-h">${col.map(card).join("")}</ul></section>`;
}

let stageId=null;
function showStage(id){
  if(id===stageId)return;stageId=id;
  const w=WORKS.find(x=>x.id===id);
  const tall=/yumak|facesa|pressed|gaze$|closer|intl/.test(id);
  $("#view").innerHTML=`<section class="stage">
    <a class="m${tall?" tall":""}" href="#w/${w.id}" aria-label="${esc(w.t[LANG])}">${media(w,"",true)}</a>
    <div class="side"><h1>${esc(w.t[LANG])}</h1><div class="line">${esc(w.md[LANG])}, ${w.year}</div>
      <p>${esc(w.txt[LANG][0])}</p><a class="go" href="#w/${w.id}">${LANG==="ko"?"작품 보기":"View work"}</a></div></section>
    <ul class="mlist" aria-label="${LANG==="ko"?"작품 전체":"All works"}">${LIST.map(x=>`<li><a href="#w/${x.id}"><img src="img/${x.img[0]}" alt="" loading="lazy" decoding="async"><span><b>${esc(x.t[LANG])}</b><small>${yr(x)}, ${esc(x.md[LANG])}</small></span></a></li>`).join("")}</ul>`;
}

function renderWork(id){
  const w=WORKS.find(x=>x.id===id);if(!w)return renderHome();
  const L=LANG,i=LIST.indexOf(w),prev=LIST[i-1],next=LIST[i+1];
  const fig=(f,k)=>`<figure><img src="img/${f}" alt="${esc((w.cap[L]||[])[k]||w.t[L])}" loading="${k<2?"eager":"lazy"}" decoding="async">${(w.cap[L]||[])[k]?`<figcaption>${esc(w.cap[L][k])}</figcaption>`:""}</figure>`;
  let imgs=w.img.map(fig);
  if(w.clip)imgs=imgs.slice(1);
  const rest=w.clip?w.img.slice(1):w.img;
  let mediaHtml=w.clip?`<figure>${media(w,/yumak|facesa|pressed/.test(w.id)?"tallv":"")}${w.clipcap?`<figcaption>${esc(w.clipcap[L])}</figcaption>`:""}</figure>`:"";
  if(w.clip2)mediaHtml+=`<figure><video src="clip/${w.clip2}" poster="img/${w.clip2poster||w.img[0]}" controls playsinline preload="none"></video><figcaption>${esc(w.clip2cap[L])}</figcaption></figure>`;
  if(w.clip){mediaHtml+=rest.length===2?`<div class="pair">${imgs.join("")}</div>`:imgs.join("")}
  else{mediaHtml+=imgs[0]+(imgs.length>1?`<div class="pair">${imgs.slice(1).join("")}</div>`:"")}
  $("#view").innerHTML=`<article class="work">
    <div class="head"><h1>${esc(w.t[L])}${w.badge?`<span class="badge">${esc(w.badge[L])}</span>`:""}</h1><div class="line">${esc(w.alt[L])}, ${w.year}</div>${w.collab?`<div class="line with">${L==="ko"?"함께":"with"} ${esc(w.collab[L])}</div>`:""}</div>
    <div class="media">${mediaHtml}</div>
    <div class="body">${w.txt[L].map(p=>`<p>${esc(p)}</p>`).join("")}
      <h2>${L==="ko"?"작품 정보":"Details"}</h2><table>${w.spec[L].map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table>
      ${w.links?`<h2>${L==="ko"?"보기":"Watch"}</h2><div class="links">${w.links.map(k=>`<a href="${k.href}" target="_blank" rel="noopener">${esc(k[L])}</a>`).join("")}</div>`:""}
      <div class="pager">${prev?`<a href="#w/${prev.id}"><span>${L==="ko"?"이전":"Previous"}</span><b>${esc(prev.t[L])}</b></a>`:"<span></span>"}${next?`<a href="#w/${next.id}"><span>${L==="ko"?"다음":"Next"}</span><b>${esc(next.t[L])}</b></a>`:""}</div>
    </div></article>`;
}

function heroMedia(mode){
  const w=WORKS.find(x=>x.id===FEATURE);
  if(mode==="live")return `<iframe src="live/yumak.html?hero&bg=c5c6c5" title="${esc(w.t[LANG])} — ${LANG==="ko"?"실시간":"real time"}" loading="eager" allow="fullscreen"></iframe>`;
  if(mode==="clip")return `<video src="clip/${w.clip}" poster="img/${w.img[0]}" autoplay muted loop playsinline preload="metadata"></video>`;
  return `<img src="img/${w.img[0]}" alt="${esc(w.t[LANG])}" decoding="async">`;
}
let heroMode=null,heroTimer=0;
function setHero(mode){heroMode=mode;const m=$("#hero");if(m){m.dataset.mode=mode;m.innerHTML=heroMedia(mode)}const h=$("#hero-hint");if(h)h.hidden=mode!=="live"}
const FORCE_LIVE=/[?&]live=1/.test(location.search);
addEventListener("message",e=>{const m=e.data&&e.data.yumak;if(!m||heroMode!=="live"||FORCE_LIVE)return;
  if(m==="ready")clearTimeout(heroTimer);else if(m==="fail"){clearTimeout(heroTimer);setHero("clip")}else if(m==="slow")setHero("still")});
function renderHome(scrollTo){
  stageId=FEATURE;clearTimeout(heroTimer);
  const w=WORKS.find(x=>x.id===FEATURE);
  const mode=FORCE_LIVE?"live":RM?"still":("gpu" in navigator)?"live":"clip";
  $("#view").innerHTML=`<section class="hero" aria-label="${esc(w.t[LANG])}">
    <div class="m" id="hero" data-mode="${mode}">${heroMedia(mode)}</div>
    <div class="cap"><h1>${esc(w.t[LANG])}</h1><div class="line">${esc(w.md[LANG])}, ${w.year}</div>
      <p>${esc(w.txt[LANG][0])}</p><a class="go" href="#w/${w.id}">${LANG==="ko"?"작품 보기":"View work"}</a>
      <div class="hint" id="hero-hint"${mode==="live"?"":" hidden"}>${LANG==="ko"?"마우스를 움직이면 빛이 따라갑니다.":"Move the mouse and the light follows."}</div></div>
    <a class="scroll" href="#works" aria-label="${LANG==="ko"?"아래로 — 작업 보기":"Scroll down to works"}"><span>${LANG==="ko"?"작업":"Works"}</span><i aria-hidden="true"></i></a>
  </section>${worksList()}`;
  heroMode=mode;
  const sc=$(".hero .scroll");if(sc)sc.onclick=e=>{e.preventDefault();$("#works").scrollIntoView({behavior:RM?"auto":"smooth"})};
  if(mode==="live"&&!FORCE_LIVE)heroTimer=setTimeout(()=>setHero("clip"),10000);
  if(scrollTo){const t=$("#works");if(t)requestAnimationFrame(()=>t.scrollIntoView())}
}
function renderPage(v){renderIndex(null);stageId=null;$("#view").innerHTML="";$("#view").appendChild($("#t-"+v).content.cloneNode(true));
  const c=$("#copy");if(c)c.onclick=async()=>{const t=$("#email").textContent.trim();try{await navigator.clipboard.writeText(t);c.textContent=LANG==="ko"?"복사했습니다":"Copied"}catch(e){const r=document.createRange();r.selectNodeContents($("#email"));getSelection().removeAllRanges();getSelection().addRange(r)}};}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll(".top nav a").forEach(a=>a.toggleAttribute("aria-current",false));
  if(h.startsWith("w/")){renderIndex(h.slice(2));renderWork(h.slice(2));document.title=(WORKS.find(x=>x.id===h.slice(2))||{t:{}}).t[LANG]+" — 윤정호"}
  else if(h==="works"){renderHome(true);const a=$('.top nav a[data-v="works"]');if(a)a.setAttribute("aria-current","page");document.title="윤정호 Yoon Jung Ho";return}
  else if(["note","cv","contact"].includes(h)){renderPage(h);const a=$(`.top nav a[data-v="${h}"]`);if(a)a.setAttribute("aria-current","page");document.title="윤정호 Yoon Jung Ho"}
  else{renderHome();document.title="윤정호 Yoon Jung Ho"}
  window.scrollTo(0,0);
}
function setLang(l){LANG=l;document.documentElement.dataset.lang=l;document.documentElement.lang=l;try{localStorage.setItem("yjh-lang",l)}catch(e){}route()}
$("#lang").onclick=()=>setLang(LANG==="ko"?"en":"ko");
addEventListener("hashchange",route);
setLang(LANG);
</script>
</body>
</html>
